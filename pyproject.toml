[project]
name = "idea-workspace-backend"
version = "0.0.0"
description = "Idea Workspace の Python バックエンド"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1",
  "fastapi>=0.162",
  "google-genai>=2.33",
  "httpx>=0.28",
  "psycopg-pool>=3.3",
  "psycopg[binary]>=3.2",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.uv]
package = false

# Vercel（FastAPI）のエントリポイント
[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# プロンプト・Markdown テンプレートは折り返すと出力内容が変わるため行長を問わない
"backend/app/services/prompts.py" = ["E501"]
"backend/app/services/fallbacks.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]
