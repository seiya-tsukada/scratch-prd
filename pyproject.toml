[project]
name = "idea-workspace-backend"
version = "0.0.0"
description = "Idea Workspace の Python バックエンド"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]
